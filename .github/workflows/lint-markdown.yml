name: Lint Markdown

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-markdown:
    permissions:
      contents: read
    uses: L3DigitalNet/project-standards/.github/workflows/lint-markdown.yml@v5
    with:
      markdownlint: true
      globs: |-
        **/*.md
        !.ruff_cache/**
        !node_modules/**
        !.agents/**
        !.claude/**
        !.codex/**
        !.github/PULL_REQUEST_TEMPLATE.md
        !.pytest_cache/**
        !.standards/**
        !.venv/**
        !AGENTS.md
        !CLAUDE.md
        !docs/STATUS.md
        !docs/TODO.md
        !docs/adr/template.md
        !docs/handoff/**
