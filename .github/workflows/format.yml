name: Format

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    permissions:
      contents: read
    uses: L3DigitalNet/project-standards/.github/workflows/format.yml@v5
    with:
      prettier: true
      globs: "**/*.md\n**/*.json\n**/*.jsonc\n**/*.yml\n**/*.yaml"
      exclusions: |-
        .agents/**
        .claude/**
        .codex/**
        .github/PULL_REQUEST_TEMPLATE.md
        .github/workflows/format.yml
        .github/workflows/lint-markdown.yml
        .import_linter_cache/**
        .pytest_cache/**
        .standards/**
        .venv/**
        AGENTS.md
        CLAUDE.md
        docs/STATUS.md
        docs/TODO.md
        docs/adr/template.md
        docs/handoff/**
